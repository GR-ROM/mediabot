# The bot on the server. Everything that differs between here and a laptop is an environment
# variable; the image is the same one either way.
#
#   docker compose up -d --build
#
# The link base has to be an address the person reading the chat can open, which on a public box
# is the box's own address — not localhost, and not the container's.

services:
  mediabot:
    build:
      # The runtime-only image: the jar is built where there is memory to spare and staged here.
      # Compiling in a container on this host is what took it down once — a JDK plus the Gradle
      # cache does not fit beside the VPN in 1.8 GB.
      context: ..
      dockerfile: deploy/Dockerfile.runtime
      args:
        JAR: deploy/app.jar
    image: mediabot:latest
    container_name: mediabot
    restart: unless-stopped
    ports:
      # The static side. Every finished file is served from here, so this is the one port that
      # has to be reachable from outside — the chat side needs no inbound connection at all,
      # because long polling dials out. Only the published port moves; the application keeps its
      # own 8099 inside, and MEDIABOT_LINK_BASE is what has to agree with the outside one.
      - "${MEDIABOT_PUBLIC_PORT:-1488}:8099"
      # Metrics, bound to loopback: Prometheus runs on the host and scrapes this, nobody else
      # can reach it. The container keeps 8080 inside; the host side avoids the port myvpn holds.
      - "127.0.0.1:${MEDIABOT_ACTUATOR_HOST_PORT:-9101}:8080"
    environment:
      MEDIABOT_LINK_BASE: ${MEDIABOT_LINK_BASE}
      MEDIABOT_TG_TOKEN: ${MEDIABOT_TG_TOKEN}
      MEDIABOT_TG_USERNAME: ${MEDIABOT_TG_USERNAME}
      MEDIABOT_OWNERS: ${MEDIABOT_OWNERS}
      MEDIABOT_ALLOWED_CHATS: ${MEDIABOT_ALLOWED_CHATS}
      MEDIABOT_SEND_FILE_UNDER: ${MEDIABOT_SEND_FILE_UNDER:-52428800}
      MEDIABOT_PER_CHAT_LIMIT: ${MEDIABOT_PER_CHAT_LIMIT:-8}
      # The model lives on a LAN address this server cannot reach, so the preflight would fail
      # every start and every unusual phrasing would wait for a timeout. The router reads the
      # commands without it; only free prose loses anything.
      MEDIABOT_LLM_URL: ${MEDIABOT_LLM_URL:-http://127.0.0.1:11434/v1}
      # Measured, not guessed. Heap in use is ~50 MB, so 384 was six times what it needed and
      # G1 was charging 38 MB of its own tables for the privilege — SerialGC brought that to
      # 0.2 MB on a box with two cores where pause times matter to nobody. Metaspace used 7 MB
      # against a 192 MB ceiling.
      JAVA_TOOL_OPTIONS: "-Xmx160m -XX:MaxMetaspaceSize=96m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m --enable-native-access=ALL-UNNAMED"
      SPRING_MAIN_BANNER_MODE: "off"
      # Empty means plain HTTP; "tls" turns on the listener that reads the pair mounted below.
      SPRING_PROFILES_ACTIVE: ${MEDIABOT_PROFILES:-}
      MEDIABOT_LLM_PREFLIGHT: "false"
      # Where the proof-of-origin tokens come from. Reachable only on the compose network, so
      # nothing outside can ask it for one.
      MEDIABOT_POT_PROVIDER: ${MEDIABOT_POT_PROVIDER:-http://potoken:4416}
    depends_on:
      - potoken
    volumes:
      # Bound to host directories rather than named volumes, so the served files and the queue
      # are ordinary paths on the box: visible with ls, copied with cp, and still there when the
      # container is thrown away and rebuilt.
      - ${MEDIABOT_DATA:-/opt/mediabot}/public:/app/public
      - ${MEDIABOT_DATA:-/opt/mediabot}/cache:/app/cache
      # The certificate and key, read-only and shared with whatever renews them. Watched at
      # runtime, so a renewal is picked up without restarting anything.
      - ${MEDIABOT_TLS_DIR:-/opt/keystore}:/opt/keystore:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # The proof-of-origin token provider.
  #
  # YouTube wants a token produced by running its own JavaScript, and refuses to a bare request with
  # "Sign in to confirm you're not a bot" — which is not really about signing in, and which cookies
  # from a real account only work around until they rot. This produces the token instead: no
  # account, nothing to export, nothing to refresh.
  #
  # No published port. It answers the bot over the compose network and nobody else needs it.
  potoken:
    image: brainicism/bgutil-ytdlp-pot-provider:latest
    container_name: mediabot-potoken
    restart: unless-stopped
    expose:
      - "4416"
    # It runs a headless browser engine to execute the challenge, which on a 1.8 GB box beside a
    # JVM and a VPN is worth bounding rather than trusting.
    mem_limit: 400m
    # Asked with node because the image has neither curl nor wget. This catches a provider that has
    # died or stopped listening — not one that answers with a token YouTube no longer accepts, which
    # nothing but a real download can tell apart. The canary in the bot is for that.
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4416/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
