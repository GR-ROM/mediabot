# The local Bot API server, which is what raises the upload ceiling from 50 MB to 2 GB.
#
# Telegram's public Bot API refuses any upload from a bot over 50 MB — which rules out most of
# what this bot is for. Running the same server yourself lifts that to 2 GB. It is the one piece
# of infrastructure this project needs, and it needs no configuration beyond the two credentials.
#
#   1. Get api_id and api_hash from https://my.telegram.org (Apps). These identify the
#      application, not the bot — the bot token stays what BotFather gave you.
#   2. Put them in .env beside this file:
#         TELEGRAM_API_ID=...
#         TELEGRAM_API_HASH=...
#   3. docker compose up -d
#   4. Point the bot at it:
#         MEDIABOT_TG_API=http://localhost:8081
#         MEDIABOT_MAX_UPLOAD=2097152000
#
# Note that a bot which has ever talked to the public API has to be logged out of it before a
# local server will accept it: call https://api.telegram.org/bot<TOKEN>/logOut once, then start
# the bot against this.

services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
      # Files stay on disk under /var/lib/telegram-bot-api rather than being held in memory.
      TELEGRAM_LOCAL: 1
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    ports:
      - "8081:8081"

volumes:
  telegram-bot-api-data:
